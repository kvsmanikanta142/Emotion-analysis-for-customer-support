<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Support Speech Analyzer</title>

<style>
body{
    background: linear-gradient(120deg,#1f4037,#99f2c8);
    font-family: Arial, sans-serif;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    background:white;
    width:420px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
    text-align:center;
}

h1{
    color:#1f4037;
}

button{
    background:#1f4037;
    color:white;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#145a4b;
}

.output-box{
    margin-top:20px;
    padding:15px;
    background:#f4f4f4;
    border-radius:10px;
    text-align:left;
}

.label{
    font-weight:bold;
    color:#333;
}

footer{
    margin-top:20px;
    font-size:12px;
    color:gray;
}
</style>

</head>

<body>

<div class="container">

<h1>🎤 Customer Support Speech Analyzer</h1>

<form method="post">
    <button type="submit">Start Recording</button>
</form>

{% if text %}
<div class="output-box">
    <p class="label">Transcribed Text:</p>
    <p>{{ text }}</p>

    <p class="label">Sentiment:</p>
    <p>{{ sentiment }}</p>

    <p class="label">Confidence:</p>
    <p>{{ score }}</p>
</div>
{% endif %}

<footer>
AI Powered Speech & NLP System
</footer>

</div>

</body>
</html>
